server:
  port: 8080
  compression: 
    enabled: true
    min-response-size: 1024
    mime-types:
      - application/json
      - application/xml
      - text/html
      - text/plain
      - text/xml
      - application/javascript
      - text/css

spring:
  profiles:
    active: local
  application:
    name: instagram

  threads:
    virtual:
      enabled: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: none          # Flyway manages DDL — Hibernate only validates

  batch:
    jdbc:
      initialize-schema: never   # Flyway creates the BATCH_* tables
    job:
      enabled: false             # do not run jobs on startup — run on demand via API

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret}
            scope: email, profile
            # Spring auto-sets redirect-uri to: {baseUrl}/login/oauth2/code/google
            # Add http://localhost:8080/login/oauth2/code/google in Google Console
  
  datasource:
    hikari:
      # Formula: (cpu_cores * 2) + 1; capped at 10 for local dev to avoid
      # overwhelming Postgres with connections on a shared developer machine.
      # Raise to 15-20 in production once connection metrics are observed.
      maximum-pool-size: 10
      minimum-idle: 10          # fixed-size pool — avoids idle-connection teardown churn
      connection-timeout: 30000 # ms — how long a thread waits for a free connection
      idle-timeout: 600000      # ms — how long an idle connection is kept (10 min)
      max-lifetime: 1800000     # ms — max age of a connection (30 min), below Postgres default
      pool-name: InstagramPool
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      
  cache:
    type: redis
    redis:
      time-to-live: 60000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  default-produces-media-type: application/json

app:
  jwt:
    rsa-private-key: ${JWT_RSA_PRIVATE_KEY}         # set via env var in prod
    rsa-public-key:  ${JWT_RSA_PUBLIC_KEY}         # set via env var in prod
    access-token-expiry-ms: 900000        # 15 minutes
    refresh-token-expiry-ms: 604800000    # 7 days
  frontend-url: ${FRONTEND_URL:http://localhost:5173}


  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:instagram-media}
    cdn-base-url: ${CDN_BASE_URL:${MINIO_ENDPOINT:http://localhost:9000}}