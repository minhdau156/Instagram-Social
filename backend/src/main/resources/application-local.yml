spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/instagram
    username: ${POSTGRES_USER:instagram}
    password: ${POSTGRES_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
        generate_statistics: true

logging:
  level:
    com.instagram: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.stat: DEBUG

app:
  storage:
    minio:
      endpoint: ${MINIO_URL:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:admin}
      secret-key: ${MINIO_SECRET_KEY:password}
      bucket: ${MINIO_BUCKET:instagram-media}

  cors:
    allowed-origins: http://localhost:5173

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: always