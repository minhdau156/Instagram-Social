spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/instagram
    username: ${POSTGRES_USER:instagram}
    password: ${POSTGRES_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
        generate_statistics: false
  
  

logging:
  level:
    com.instagram: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

app:
  minio:
    cdn-base-url: http://localhost:9000   # local: serve directly from MinIO, no CDN needed

  cors:
    allowed-origins: http://localhost:5173

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,prometheus
  endpoint:
    health:
      show-details: always
  
  tracing:
    sampling:
      probability: 1.0

  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
